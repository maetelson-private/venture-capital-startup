# 롱리스트 공개 페이지(site/) → GitHub Pages.
# 페이지는 로컬 DB 에서 만든다: `python -m hcdb cards --public` → site/index.html 을 커밋·푸시하면 배포된다.
# 저장소 Settings → Pages → Source 를 'GitHub Actions' 로 한 번 설정해야 한다.
name: Deploy longlist to Pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
